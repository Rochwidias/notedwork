<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151c"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pencilWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Base App Icon Squircle Frame -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#262b3a" stroke-width="2.5"/>

  <!-- Master Composition: Monogram N constructed from Academic Suite Elements (Calendar + Note + Email + Pencil) -->
  <g transform="translate(106, 96)">

    <!-- 1. BACKDROP ELEMENT: Calendar / Schedule Frame (Top Tabs & Perforations) -->
    <!-- Calendar Top Twin Tabs / Binder Pegs -->
    <rect x="52" y="0" width="22" height="32" rx="7" fill="#d97706"/>
    <rect x="226" y="0" width="22" height="32" rx="7" fill="#d97706"/>

    <!-- Outer Note / Calendar Plate Container (Muted technical dark slate) -->
    <rect x="20" y="20" width="260" height="280" rx="28" fill="#161922" stroke="#2d3345" stroke-width="2.5"/>
    <!-- Calendar Header Line -->
    <line x1="20" y1="64" x2="280" y2="64" stroke="#252a38" stroke-width="2"/>

    <!-- Mini Calendar Date Dots Matrix inside header strip -->
    <circle cx="56" cy="42" r="3.5" fill="#475569"/>
    <circle cx="80" cy="42" r="3.5" fill="#475569"/>
    <circle cx="104" cy="42" r="3.5" fill="#475569"/>
    <circle cx="196" cy="42" r="3.5" fill="#475569"/>
    <circle cx="220" cy="42" r="3.5" fill="#475569"/>
    <circle cx="244" cy="42" r="3.5" fill="#f59e0b"/>

    <!-- 2. LEFT STEM OF 'N': Ruled Note Document / Checklist Spine -->
    <!-- Document Page shape -->
    <rect x="42" y="80" width="52" height="204" rx="10" fill="#f8fafc"/>
    <!-- Note-taking horizontal ruled lines on the stem -->
    <line x1="54" y1="120" x2="82" y2="120" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="54" y1="148" x2="82" y2="148" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="54" y1="176" x2="82" y2="176" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="54" y1="204" x2="74" y2="204" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <!-- Active note indicator dot -->
    <circle cx="68" cy="98" r="4.5" fill="#d97706"/>

    <!-- 3. DIAGONAL OF 'N': Dynamic Origami Envelope Fold (Email Sync) -->
    <!-- Envelope V-Fold Diagonal Bar -->
    <path d="M 84 80 L 214 236 L 214 284 L 168 284 L 42 134 L 42 80 Z" fill="#e2e8f0"/>

    <!-- Envelope Inner Flap / Mail Chevron Detail -->
    <polygon points="84,80 156,150 178,132 108,80" fill="#cbd5e1"/>
    <!-- Mail Notification Stamp (Amber Gold) -->
    <path d="M 126 128 L 164 168 L 146 186 L 108 146 Z" fill="url(#amberGrad)"/>

    <!-- 4. RIGHT STEM OF 'N': Precision Drafting Pencil pointing upwards into calendar -->
    <!-- Pencil Body (Faceted Right Stem) -->
    <rect x="206" y="112" width="52" height="172" rx="10" fill="#f8fafc"/>
    <!-- Pencil faceted shadow partition -->
    <rect x="232" y="112" width="26" height="172" rx="0" fill="#e2e8f0"/>
    <!-- Brass ferrule band connecting pencil tip -->
    <rect x="206" y="102" width="52" height="10" fill="#334155"/>
    <rect x="206" y="96" width="52" height="6" fill="#d97706"/>

    <!-- Sharpened Pencil Tip Cone pointing up -->
    <polygon points="206,96 258,96 232,54" fill="url(#pencilWood)"/>
    <!-- Lead Graphite Nib (Top sharp point) -->
    <polygon points="222,70 242,70 232,54" fill="#0f172a"/>

    <!-- Live Sync / Activity Spark at pencil apex -->
    <circle cx="232" cy="42" r="5" fill="#fbbf24"/>
  </g>

  <!-- Wordmark 'notedwork' at bottom for strong brand lockup -->
  <g transform="translate(0, 428)">
    <text x="256" y="0" text-anchor="middle" fill="#f8fafc" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="34" letter-spacing="-0.03em">notedwork</text>
    <text x="256" y="24" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="13" letter-spacing="0.12em">EMAIL • NOTES • SCHEDULE</text>
  </g>
</svg>
